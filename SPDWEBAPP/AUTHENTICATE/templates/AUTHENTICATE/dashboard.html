{% extends 'HOME/main.html' %}

<!-- Day Light Savings Notifier -->
{% load dls_tags %}

{% block content %}

<!-- Announcement Alert Notifier -->
{% include 'MISC/announcement_alert.html' %}

<div class="d-grid gap-2 col-3 mx-auto dashboard-buttons">
    {% if dashboard_links %}
        {% for link in dashboard_links %}
            <a href="{{ link.link }}" target="_blank">
                <button class="btn btn-primary" type="button">{{ link.text }}</button>
            </a>
        {% endfor %}
    {% else %}
        <a href="https://mailmissouri-my.sharepoint.com/:p:/g/personal/***REMOVED***" target="_blank">
            <button class="btn btn-primary" type="button">CALENDAR</button>
        </a>
        <a href="webcal://calendar.google.com/calendar/ical/***REMOVED***" target="_blank">
            <button class="btn btn-primary" type="button">Subscribe To Calendar</button>
        </a>
        <a href="https://docs.google.com/spreadsheets/d/***REMOVED***" target="_blank">
            <button class="btn btn-primary" type="button">RECRUITMENT</button>
        </a>
        <a href="https://drive.google.com/drive/u/1/folders/***REMOVED***" target="_blank">
            <button class="btn btn-primary" type="button">Google Drive</button>
        </a>
    {% endif %}
    <a href="{% url 'philanthropy_dashboard' %}">
        <button class="btn btn-primary" type="button">Philanthropy</button>
    </a>
    <a href="{% url 'poll' %}">
        <button class="btn btn-primary" type="button">Parley Pro</button>
    </a>
    <a href="{% url 'roster' %}">
        <button class="btn btn-primary" type="button">Roster</button>
    </a>
    <a href="{% url 'alumni_roster' %}">
        <button class="btn btn-primary" type="button">Alumni Roster</button>
    </a>
    <a href= "{% url 'newmember_marks_dashboard'%}">
        <button class="btn btn-primary" type="button">New Member Marks</button>
    </a>
    {% dls_alert %}
</div>
{% endblock %}
